<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>JAR Real Estate — Check-In</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JAR Check-In">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#000;--fg:#fff;--muted:#bdbdbd}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:20px}
    .app{max-width:920px;width:100%;background:linear-gradient(0deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02));border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
    header{display:flex;gap:16px;align-items:center}
    .logo{width:66px;height:66px;border-radius:10px;background:#111;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
    h1{margin:0;font-size:20px}
    p.lead{margin:6px 0 18px;color:var(--muted)}
    form{display:grid;gap:12px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,select,textarea{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--fg);font-size:16px;outline:none}
    textarea{min-height:84px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .full{grid-column:1/-1}
    .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:12px 16px;border-radius:10px;border:none;background:#fff;color:#000;font-weight:600;cursor:pointer}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--fg)}
    .small{font-size:13px;color:var(--muted)}
    .status{padding:10px;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--muted);font-size:14px}
    .list{margin-top:16px;border-radius:10px;padding:12px;background:rgba(255,255,255,0.02);max-height:200px;overflow:auto}
    .list-item{padding:8px;border-bottom:1px solid rgba(255,255,255,0.02);font-size:14px;color:var(--muted)}
    @media (max-width:640px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="JAR Real Estate Check-In App">
    <header>
      <div class="logo">JAR</div>
      <div>
        <h1>JAR Real Estate — Open House Check-In</h1>
        <p class="lead">943 Allendale Dr, Hampton, VA 23669 — Please sign in below</p>
      </div>
    </header>

    <form id="checkinForm" autocomplete="off">
      <div class="row">
        <div>
          <label for="name">Full Name *</label>
          <input id="name" name="name" type="text" required placeholder="John Doe" />
        </div>
        <div>
          <label for="phone">Phone Number *</label>
          <input id="phone" name="phone" type="tel" required placeholder="(555) 123-4567" />
        </div>
      </div>

      <div>
        <label for="email">Email Address *</label>
        <input id="email" name="email" type="email" required placeholder="name@example.com" />
      </div>

      <div class="row">
        <div>
          <label for="represented">Represented by an agent?</label>
          <select id="represented" name="represented">
            <option>No</option>
            <option>Yes</option>
            <option>Not sure</option>
          </select>
        </div>
        <div>
          <label for="agent">Agent name & brokerage</label>
          <input id="agent" name="agent" type="text" placeholder="Agent Name — Brokerage" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="timeline">Timeline to purchase</label>
          <select id="timeline" name="timeline">
            <option>Actively looking (0–3 months)</option>
            <option>Within 3–6 months</option>
            <option>Within 6–12 months</option>
            <option>Just exploring today</option>
          </select>
        </div>
        <div>
          <label for="source">Heard about this open house</label>
          <select id="source" name="source">
            <option>Zillow</option>
            <option>Realtor.com</option>
            <option>Social media</option>
            <option>Friend or family</option>
            <option>Drive-by / Sign</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div>
        <label for="updates">Would you like updates about new listings or open houses?</label>
        <select id="updates" name="updates">
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <div>
        <label for="notes">Notes or questions for JAR Real Estate</label>
        <textarea id="notes" name="notes" placeholder="Any questions or notes..."></textarea>
      </div>

      <div class="actions full">
        <button id="submitBtn" type="submit">Sign In</button>
        <button id="clearBtn" type="button" class="secondary">Clear</button>
        <button id="exportBtn" type="button" class="secondary">Export CSV</button>
        <button id="deleteAllBtn" type="button" class="secondary">Delete All</button>
        <div style="flex:1"></div>
        <div class="status" id="status">Ready</div>
      </div>
    </form>

    <div class="small" style="margin-top:12px">Saved sign-ins (latest first):</div>
    <div class="list" id="entriesList" aria-live="polite"></div>
  </div>

<script>
/* Simple IndexedDB wrapper */
const DB_NAME = 'jar_checkin_db';
const DB_STORE = 'entries';
const DB_VERSION = 1;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function addEntry(obj) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const store = tx.objectStore(DB_STORE);
    const req = store.add(obj);
    req.onsuccess = ()=>{ resolve(req.result); db.close(); };
    req.onerror = ()=>{ reject(req.error); db.close(); };
  });
}

async function getAllEntries() {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const store = tx.objectStore(DB_STORE);
    const req = store.getAll();
    req.onsuccess = ()=>{ resolve(req.result.reverse()); db.close(); };
    req.onerror = ()=>{ reject(req.error); db.close(); };
  });
}

async function clearAllEntries() {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const store = tx.objectStore(DB_STORE);
    const req = store.clear();
    req.onsuccess = ()=>{ resolve(true); db.close(); };
    req.onerror = ()=>{ reject(req.error); db.close(); };
  });
}

/* Helpers */
const form = document.getElementById('checkinForm');
const statusEl = document.getElementById('status');
const entriesList = document.getElementById('entriesList');

function setStatus(msg, busy=false){
  statusEl.textContent = msg;
  statusEl.style.opacity = busy ? '0.8' : '1';
}

function entryRowHtml(e){
  const time = new Date(e.created_at).toLocaleString();
  return `<div class="list-item"><strong>${e.name}</strong> — ${e.phone} — ${e.email}<br><span style="color:var(--muted);font-size:13px">${e.represented} • ${e.timeline} • ${time}</span></div>`;
}

async function refreshList(){
  const rows = await getAllEntries();
  entriesList.innerHTML = rows.map(entryRowHtml).join('') || '<div class="list-item" style="color:var(--muted)">No entries yet</div>';
}

/* CSV Export */
function entriesToCSV(entries){
  const header = ['id','created_at','property','name','phone','email','represented','agent','timeline','source','updates','notes'];
  const rows = entries.map(en => header.map(h => {
    const v = en[h] !== undefined ? en[h] : '';
    // escape quotes
    return `"${String(v).replace(/"/g,'""')}"`;
  }).join(','));
  return header.join(',') + '\n' + rows.join('\n');
}

/* Form submit handling */
form.addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  try{
    const data = {
      created_at: new Date().toISOString(),
      property: '943 Allendale Dr, Hampton, VA 23669',
      name: form.name.value.trim(),
      phone: form.phone.value.trim(),
      email: form.email.value.trim(),
      represented: form.represented.value,
      agent: form.agent.value.trim(),
      timeline: form.timeline.value,
      source: form.source.value,
      updates: form.updates.value,
      notes: form.notes.value.trim()
    };

    // basic validation
    if(!data.name || !data.phone || !data.email){
      alert('Please fill name, phone, and email.');
      return;
    }

    setStatus('Saving...', true);
    await addEntry(data);
    setStatus('✓ Submitted — Thank you!');
    // auto-reset after short delay
    setTimeout(()=>{ form.reset(); setStatus('Ready'); form.name.focus(); refreshList(); }, 700);

  }catch(err){
    console.error(err);
    setStatus('Error saving — see console');
    alert('Save failed: ' + (err.message || err));
  }
});

/* Buttons */
document.getElementById('clearBtn').addEventListener('click', ()=>{form.reset(); setStatus('Cleared'); form.name.focus();});
document.getElementById('deleteAllBtn').addEventListener('click', async ()=>{
  if(!confirm('Delete all saved entries from this device? This cannot be undone.')) return;
  await clearAllEntries();
  setStatus('All entries deleted');
  refreshList();
});

document.getElementById('exportBtn').addEventListener('click', async ()=>{
  setStatus('Preparing CSV...',true);
  const rows = await getAllEntries();
  if(!rows.length){ setStatus('No entries to export'); return; }
  const csv = entriesToCSV(rows);
  const blob = new Blob([csv], {type:'text/csv'});
  const filename = `jar_checkins_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
  // use Web Share if available
  if(navigator.canShare && navigator.canShare({files:[new File([blob], filename, {type:'text/csv'})]})){
    try{
      await navigator.share({files:[new File([blob], filename, {type:'text/csv'})], title: 'JAR Check-ins', text: 'Open house check-ins CSV'});
      setStatus('Shared CSV');
      return;
    }catch(e){ console.warn('Share failed', e); }
  }
  // otherwise download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setStatus('CSV downloaded');
});

window.addEventListener('load', async ()=>{
  try{
    await refreshList();
    form.name.focus();
    // register service worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js').catch((e)=>console.log('SW register failed', e));
    }
  }catch(e){ console.error(e); }
});
</script>
</body>
</html>
